[package]
name = "udf-viewer"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Phase 2 (Windows): standalone viewer (WebView2 + 'Open in UYAP Editor')."

[[bin]]
name = "udf-viewer"
path = "src/main.rs"

[dependencies]
udf-core = { path = "../udf-core" }

# WebView2 host + window + Win32 shell calls — Windows only. On other platforms the binary
# compiles to a small stub (keeps `cargo build --workspace` working on the Linux CI lane).
[target.'cfg(windows)'.dependencies]
wry = "0.45"
tao = "0.30"
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }
